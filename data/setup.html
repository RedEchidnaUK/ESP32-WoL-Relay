<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>ESP32 Wake on Lan Relay</title>
    <meta name="viewport" content="width=device-width">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h2>ESP32 WoL Relay Setup</h2>
    <form method="POST" action="/save" id="save" class="form">
        <div class="bar">
            <div class="bar-item">WiFi Settings</div>
        </div>
        </div>
        <div class="form-field container">
            <div class="left">
                <label for="wifiSSID">WiFi SSID:</label>
                <label for="wifiPassword">WiFi Password:</label>
            </div>
            <div class="right">
                <div><input type="text" id="wifiSSID" name="wifiSSID" size="32" required></div>
                <div><input type="password" id="wifiPassword" name="wifiPassword" size="32" required></div>
            </div>
        </div>
        <div class="bar">
            <div class="bar-item">Admin Settings</div>
        </div>
        <div class="form-field container">
            <div class="left">
                <label for="adminUser">Admin Username:</label>
                <label for="adminPassword">Admin Password:</label>
            </div>
            <div class="right">
                <div>
                    <input type="text" id="adminUser" name="adminUser" size="32" value="admin" required>
                </div>
                <div>
                    <input type="password" id="adminPassword" name="adminPassword" size="32" required>
                    <button type="button" id="toggle" class="custom-button-small"
                        onclick="alertbox('<div class=center>' + default_Password + '</div>')">Show MAC
                        Address</button>
                </div>
                <small>The default password is the MAC address</small>
            </div>
        </div>
        <div class="bar">
            <div class="bar-item">API Settings</div>
        </div>
        <div class="form-field container">
            <div class="left">
                <label for="apiKey">API Key:</label>
            </div>
            <div class="right">
            <div>
                <input type="text" id="apiKey" name="apiKey" size="40" class="form-field" required>&nbsp;<button
                    type="button" onclick="generateAPIKey()" class="custom-button-small">Generate</button>
                <br>
            </div>
                <small>The API Key will not be shown again. A new one may be generated later</small>
            </div>
        </div>
        <div class="center">
            <input type="submit" value="Save" id="saveButton" class="custom-button">
        </div>
    </form>
    <div id="customAlertBox" class="custom-alert">
        <div class="custom-alert-content">
            <span class="close">&times;</span>
            <p id="alertMessage"></p>
        </div>
    </div>
    <script src="setup.js"></script>
    <noscript>Sorry, your browser does not support JavaScript!</noscript>
</body>

</html>
