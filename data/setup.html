<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>ESP32 Wake on Lan Relay</title>
    <meta name="viewport" content="width=device-width">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h2>ESP32 WoL Relay Setup</h2>
    <form method="POST" action="/save"></form>
    <div class="bar" style="padding: 8px 16px;">
        WiFi Settings
    </div>
    <div class="form-field container">
        <div class="left">
            <label for="wifiSSID">WiFi SSID:</label>
            <label for="wifiPassword">WiFi Password:</label>
        </div>
        <div class="right">
            <div><input type="text" id="wifiSSID" name="wifiSSID" size="32"></div>
            <div><input type="password" id="wifiPassword" name="wifiPassword" size="32"></div>
        </div>
    </div>
    <div class="bar" style="padding: 8px 16px;">Admin Settings</div>
    <div class="form-field container">
        <div class="left">
            <label for="adminUser">Admin Username:</label>
            <label for="adminPassword">Admin Password:</label>
        </div>
        <div class="right">
            <div><input type="text" id="adminUser" name="adminUser" size="32" value="admin"></div>
            <div><input type="password" id="adminPassword" name="adminPassword" size="32"></div>
        </div>
    </div>
    <div class="bar" style="padding: 8px 16px;">API Settings</div>
    <div class="form-field">
        <label for="apiKey">API Key:</label>
        <input type="text" id="apiKey" name="apiKey" size="40" class="form-field">&nbsp;<button type="button"
            onclick="generateAPIKey()" class="custom-button-small">Generate</button>
        <br>
        <small>You will not see the API Key again, but you can change it later</small>
    </div>
    <div class="center">
        <input type="submit" value="Save" id="saveButton" class="custom-button">
    </div>
    </form>
    <script src="setup.js"></script>
    <noscript>Sorry, your browser does not support JavaScript!</noscript>
</body>

</html>
