<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>ESP32 Wake on Lan Relay</title>
    <meta name="viewport" content="width=device-width">
    <link rel="stylesheet" href="../assets/style.css">
    <link rel="icon" type="image/x-icon" href="../assets/favicon.svg">
</head>

<body>
    <h2>ESP32 WoL Relay Setup</h2>
    <div id="setup">
        <div class="bar">
            <div class="bar-item">WiFi Settings</div>
        </div>
        <div class="form-field container">
            <div class="left">
                <label for="wifiSSID">WiFi SSID:</label>
                <label for="wifiPassword">WiFi Password:</label>
            </div>
            <div class="right">
                <div><input type="text" id="wifiSSID" name="wifiSSID" size="32" required minlength="1"></div>
                <div><input type="password" id="wifiPassword" name="wifiPassword" size="32" required minlength="8" maxlength="63"></div>
            </div>
        </div>
        <div class="bar">
            <div class="bar-item">Admin Settings</div>
        </div>
        <div class="form-field container">
            <div class="left">
                <label for="adminUser">Admin Username:</label>
                <label for="adminPassword">Admin Password:</label>
            </div>
            <div class="right">
                <div>
                    <input type="text" id="adminUser" name="adminUser" size="32" value="admin" required minlength="1" maxlength="32">
                </div>
                <div>
                    <input type="password" id="adminPassword" name="adminPassword" size="32" required minlength="12" maxlength="32">
                    <button type="button" id="toggle" class="custom-button-small"
                        onclick="alertbox('<div class=center>' + defaultPassword + '</div>')">Show MAC
                        Address</button>
                </div>
                <small>The default password is the MAC address</small>
            </div>
        </div>
        <div class="bar">
            <div class="bar-item">API Settings</div>
        </div>
        <div class="form-field container">
            <div class="left">
                <label for="apiKey">API Key:</label>
            </div>
            <div class="right">
                <div>
                    <input type="text" id="apiKey" name="apiKey" size="40" class="form-field" required minlength="1" maxlength="40">&nbsp;<button
                        type="button" onclick="generateAPIKey()" class="custom-button-small">Generate</button>
                    <br>
                </div>
                <small>The API Key will not be shown again. A new one may be generated later</small>
            </div>
        </div>
        <div class="bar">
            <div class="bar-item">HTTPS Settings:</div>
        </div>
        <div class="form-field">
            <div class="container">
                <div class="left">
                    Enable HTTPS:
                </div>
                <div class="right">
                    <div class="checkbox-wrapper-22">
                        <label class="switch" for="httpsEnabled">
                            <input type="checkbox" name="httpsEnabled" id="httpsEnabled" title="httpsEnabled" checked="true"
                                onchange="enableHTTPS()">
                            <div class="slider round"></div>
                        </label>
                    </div>
                </div>
            </div>
            <div class="certArea">
                <label for="certificate">PEM Certificate:</label>
                <div>
                    <textarea name="certificate" id="certificate" rows="10"></textarea>
                </div>
            </div>
            <div class="certArea">
                <label for="certificateKey">PEM Certificate Private Key:</label>
                <div>
                    <textarea name="certificateKey" id="certificateKey" rows="10"></textarea>
                </div>
            </div>
        </div>
        <div class="center">
            <button type="button" onclick="saveSettings()" class="custom-button">Save</button>
        </div>
    </div>
    <div id="customAlertBox" class="custom-alert">
        <div class="custom-alert-content">
            <span class="close">&times;</span>
            <p id="alertMessage"></p>
        </div>
    </div>
    <script src="./setup.js"></script>
    <script src="../assets/script.js"></script>
    <noscript>Sorry, your browser does not support JavaScript!</noscript>
</body>

</html>
